# Regenerate the committed static sitemaps in public/ from the canonical
# catalog and land the refresh on main (which triggers the normal Vercel
# deploy). The sitemaps are static files — not serverless routes — so crawler
# fetches never depend on a live backend; this workflow is the only thing that
# talks to the backend. See scripts/generate_sitemaps.mjs for the full story.
#
# main is protected (PRs only + required `test` check, admins included), so the
# refresh lands via a short-lived PR: push bot/sitemap-refresh, dispatch the
# Tests workflow on it (a GITHUB_TOKEN push triggers no workflows, but explicit
# workflow_dispatch is exempt from that rule and its `test` check run counts
# for the required check), wait for green, squash-merge. A red test run fails
# this job red and leaves the PR open for inspection.
#
# The generator is deterministic (sorted, no timestamps) and exits non-zero
# WITHOUT writing when the new build looks truncated (never publish a stub
# over the full set), so a backend outage makes this run fail red and the
# committed last-known-good keeps serving.
name: Regenerate sitemaps

on:
  schedule:
    - cron: '17 1,7,13,19 * * *' # every 6h, off the top of the hour
  workflow_dispatch:
    inputs:
      force:
        # For deliberate large shrinks — e.g. the renderable filter's first
        # run drops ~3,689 → ~1,732 URLs (removing already-dead shells),
        # which the 50% guard would otherwise refuse. Scheduled runs never
        # force.
        description: 'Bypass the shrink guard (sets SITEMAP_FORCE=1)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write # create + merge the refresh PR
  actions: write # dispatch the Tests workflow onto the PR branch

concurrency:
  group: sitemaps
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Generation ~20s + tests <2 min + a 15-min poll budget; the default is 6h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Snapshot BEFORE generation: the pre-warm step diffs previous vs new to
      # find ADDED urls. Taken from the checkout rather than git history because
      # the checkout is fetch-depth 1, so HEAD~1 is not available.
      - name: Snapshot previous sitemap
        run: cp public/sitemap-products.xml /tmp/sitemap-products.prev.xml || true
      - name: Generate sitemaps
        run: node scripts/generate_sitemaps.mjs
        env:
          # Empty (guard active) unless a manual dispatch checked `force`.
          SITEMAP_FORCE: ${{ inputs.force == true && '1' || '' }}
      - name: Commit, PR, and merge if changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/sitemap-refresh
        run: |
          FILES="public/sitemap.xml public/sitemap-static.xml public/sitemap-products.xml public/retired-sigs.json"
          if git diff --quiet -- $FILES; then
            echo "sitemaps unchanged"
            exit 0
          fi
          git config user.name "pivota-sitemap-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          # -B + force-push: a leftover branch from a failed run is stale by
          # definition (its data is 6h old) — always supersede it.
          git checkout -B "$BRANCH"
          git add $FILES
          git commit -m "chore(seo): refresh generated sitemaps"
          git push -f origin "$BRANCH"
          SHA=$(git rev-parse HEAD)

          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(seo): refresh generated sitemaps" \
              --body "Automated refresh from the sitemaps cron. Squash-merged automatically once the required \`test\` check is green."
            PR=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          fi

          gh workflow run test.yml --ref "$BRANCH"

          # Tests observed <2 min; budget 15 min for runner queue.
          CONCLUSION=""
          for _ in $(seq 1 60); do
            sleep 15
            CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=test" \
              -q '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // empty')
            [ -n "$CONCLUSION" ] && break
          done
          if [ "$CONCLUSION" != "success" ]; then
            echo "test check concluded '${CONCLUSION:-timeout}' on $SHA — leaving PR #$PR open" >&2
            exit 1
          fi

          gh pr merge "$PR" --squash
          # Not `--delete-branch`: that also switches/deletes the LOCAL branch,
          # which we are standing on. Remote-only delete.
          git push origin --delete "$BRANCH" || true
      # Warm the ISR cache for urls NEW in this build, so the first crawler hit
      # lands on a warm page instead of paying the 3-5s cold fill (and sometimes
      # a 500 — ~15% at 12-way concurrency, measured 2026-07-28). Best-effort:
      # the script always exits 0; a slow tail here must never mark the cron red.
      - name: Pre-warm newly added URLs
        run: node scripts/prewarm_sitemap.mjs --base /tmp/sitemap-products.prev.xml --head public/sitemap-products.xml
