# Runs the test suite for this repo — until this landed, nothing did.
#
# `.github/workflows/sitemaps.yml` was the ONLY workflow, and Vercel builds with
# `next build`, so `npm test` ran nowhere: vitest assertions guarded nothing and
# main had been red since 2026-05-21 without anyone seeing it (#277).
#
# A GATE since 2026-08-13: branch protection on `main` requires PRs and this
# workflow's `test` check (admins included). That is also why sitemaps.yml
# lands its refresh via a PR and dispatches this workflow onto the PR branch —
# GITHUB_TOKEN pushes trigger no workflows, so without the dispatch the
# required check would never run and the bot PR could never merge.
#
# Deliberately does NOT run `next build` — Vercel already does that on every PR,
# and duplicating a multi-minute build here buys nothing.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR push supersedes its own in-flight run.
#
# Every main push gets its OWN group, keyed by sha. `cancel-in-progress: false`
# would NOT have been enough: GitHub keeps at most one PENDING run per group, so
# a third merge landing while one run is in-flight and another is queued evicts
# the queued one — that commit would get a cancelled run and never a real
# result. With merges sometimes landing minutes apart here, that is not
# hypothetical. Per-sha groups mean main pushes never queue behind each other.
concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Observed runtime is under 2 minutes. The default is 6 HOURS, which a hung
    # jsdom waitFor would happily burn.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches sitemaps.yml, which runs the same scripts/ code.
          node-version: 22
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # Each gate runs even if an earlier GATE failed, so one red run reports
      # every problem at once instead of one per push-and-wait cycle. All three
      # are still skipped if install failed, since their output would be noise.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
